services:
  # Express API
  - type: web
    name: people-of-the-past-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build --workspace=packages/shared && npm run build --workspace=apps/api
    startCommand: npm run start --workspace=apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.18.0
      - key: MONGODB_URI
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        value: https://api.pot.local
      - key: WEB_ORIGIN
        sync: false
      - key: MODEL_NAME
        value: gemma4:e2b

  # React + Vite frontend
  - type: web
    name: people-of-the-past-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace=packages/shared && npm run build --workspace=apps/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        value: https://api.pot.local
      - key: VITE_API_BASE_URL
        sync: false
